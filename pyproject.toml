[project]
name = "nemotron-voicechat-asr-multilingual"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pot",
    "pyyaml",
    "requests",
    "scipy",
    "soundfile",
    "torch",
    "tqdm",
    "websockets>=15,<16",
]

[project.optional-dependencies]
data-preparation = [
    "pyarrow>=20",
]
interface-fitting = [
    "accelerate==1.10.1",
    "bitsandbytes==0.47.0",
    "einops==0.8.1",
    "transformers==4.51.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
